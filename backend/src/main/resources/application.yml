server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: student-academic-management
  profiles:
    active: local
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false

# Common HikariCP configuration
datasource:
  hikari:
    maximum-pool-size: 20
    minimum-idle: 5
    idle-timeout: 300000
    connection-timeout: 20000
    max-lifetime: 1200000
    pool-name: StudentAcademicHikariPool

# JPA/Hibernate
jpa:
  hibernate:
    ddl-auto: none
  show-sql: false
  properties:
    hibernate:
      format_sql: true

# Security
security:
  jwt:
    secret: ${JWT_SECRET:studentAcademicManagementSecretKey2024!@#$%^&*()}
    expiration: 86400000 # 24 hours
    refresh-expiration: 604800000 # 7 days

# Logging
logging:
  level:
    com.studentmgmt: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/student-academic-management.log

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# OpenAPI/Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.studentmgmt.controller
  paths-to-match: /api/**

# Application specific
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  pagination:
    default-page-size: 20
    max-page-size: 100
  grading:
    default-policy: STANDARD
    policies:
      STANDARD:
        A_PLUS: 90
        A: 80
        B_PLUS: 70
        B: 60
        C: 50
        D: 40
        F: 0