spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:student_academic_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: StudentAcademicHikariPool
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/schema-h2.sql
      data-locations: classpath:db/migration/data-h2.sql
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  hibernate:
    ddl-auto: create-drop