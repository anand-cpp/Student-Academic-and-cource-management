# Security
security:
  jwt:
    secret: studentAcademicManagementSecretKey2024!@#$%^&*()
    expiration: 86400000 # 24 hours
    refresh-expiration: 604800000 # 7 days

# Logging
logging:
  level:
    com.studentmgmt: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# OpenAPI/Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.studentmgmt.controller
  paths-to-match: /api/**

# Application specific
app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  pagination:
    default-page-size: 20
    max-page-size: 100
  grading:
    default-policy: STANDARD
    policies:
      STANDARD:
        A_PLUS: 90
        A: 80
        B_PLUS: 70
        B: 60
        C: 50
        D: 40
        F: 0